appId: com.ianmora.steward
productName: Steward
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - "**/node_modules/node-pty/**"
# `npm run package` usa --dir (sin instalador, rápido). CI usa estos targets.
win:
  target: nsis
linux:
  target: AppImage
  category: Development
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # Sin certificado de Apple: la app sale sin firmar (Gatekeeper pedirá confirmación).
  identity: null
