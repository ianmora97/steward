name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms from Milestone 1: a packaging or toolchain problem
        # should fail here rather than on the day of a release.
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      # The end-to-end suite drives a real Electron window, which needs a
      # display server on Linux.
      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: End-to-end smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: End-to-end smoke test (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e

      - name: Package
        run: npx electron-builder --dir

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: steward-${{ matrix.os }}
          path: release/
          retention-days: 7
          if-no-files-found: error
